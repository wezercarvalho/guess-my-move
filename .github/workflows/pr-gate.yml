name: pr-gate

# Único entrypoint de PR: seleciona governança, código e auditoria de dependências por path. O job
# final (`gate`) é o required check: consolida seleção e resultados; falha/cancelamento ou job
# aplicável ignorado bloqueiam.
# O job de governança (id sdd) cobre a verificação do SDD, a formatação dos docs da raiz
# (AGENTS.md, CLAUDE.md, README.md, docs/, specs/) e os testes dos próprios gates com uma única
# instalação de dependências; cada verificação é um passo com condição própria.
# PR em rascunho não roda nada (economiza minutos; o GitHub não mergeia rascunho): o gate roda ao
# abrir a PR já pronta, a cada push em PR pronta e, automaticamente, quando o rascunho é marcado
# como pronto (ready_for_review).
# O job `code` roda `yarn check:all` (typecheck, lint, test, build) nos workspaces quando o PR
# toca apps/, packages/, manifesto/lockfile, tsconfig*, config do Oxlint ou .env.example. O padrão
# é espelhado EXATAMENTE em scripts/git-hooks/scopes.mjs e o job entra em `SELECTED_JOBS` de
# scripts/sdd/check-job-results.mjs.
on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]

permissions:
    contents: read

concurrency:
    group: pr-gate-${{ github.ref }}
    cancel-in-progress: true

jobs:
    detect-changes:
        name: detectar paths alterados
        if: github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            sdd: ${{ steps.filter.outputs.sdd }}
            root-docs: ${{ steps.filter.outputs.root-docs }}
            tooling: ${{ steps.filter.outputs.tooling }}
            code: ${{ steps.filter.outputs.code }}
            audit: ${{ steps.filter.outputs.audit }}
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false
                  fetch-depth: 0

            # Comparar a base com a árvore efetivamente testada; nomes tratados como dados.
            - name: Detectar paths alterados
              id: filter
              shell: bash
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  MERGE_SHA: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  git diff --no-renames --name-only -z "$BASE_SHA" "$MERGE_SHA" > "$RUNNER_TEMP/pr-paths"

                  SDD_PATTERN='^specs/|^scripts/sdd/|^test/sdd/|^docs/development-strategies/sdd/|^AGENTS\.md$|^(package\.json|yarn\.lock)$|^\.github/workflows/pr-gate\.yml$|^\.yarnrc\.yml$|^\.npmrc$|^\.yarn/|^\.gitattributes$|^\.github/actions/|^(CONTRIBUTING|SECURITY|CODE_OF_CONDUCT)\.md$|^\.github/(ISSUE_TEMPLATE/|PULL_REQUEST_TEMPLATE\.md$)'
                  ROOT_DOCS_PATTERN='^(AGENTS\.md|CLAUDE\.md|README\.md|\.prettierrc|docs/|specs/|\.github/workflows/pr-gate\.yml$)|^(CONTRIBUTING|SECURITY|CODE_OF_CONDUCT)\.md$|^\.github/(ISSUE_TEMPLATE/|PULL_REQUEST_TEMPLATE\.md$)'
                  TOOLING_PATTERN='^scripts/(git-hooks|lib)/|^scripts/(audit-dependencies\.mjs|audit-runtime\.mjs|dependency-audit-exceptions\.json)$|^test/(gates|security)/|^\.githooks/|^\.github/workflows/|^(package\.json|yarn\.lock|\.prettierrc|\.node-version)$|^\.yarnrc\.yml$|^\.npmrc$|^\.yarn/|^\.gitattributes$|^\.github/actions/|^\.github/CODEOWNERS$|^(CONTRIBUTING|SECURITY|CODE_OF_CONDUCT)\.md$|^\.github/(ISSUE_TEMPLATE/|PULL_REQUEST_TEMPLATE\.md$)'
                  CODE_PATTERN='^apps/|^packages/|^contracts/|^(package\.json|yarn\.lock)$|^tsconfig[^/]*\.json$|^\.oxlintrc\.json$|^\.env\.example$|^\.node-version$|^\.yarnrc\.yml$|^\.npmrc$|^\.yarn/|^\.gitattributes$|^\.github/actions/|^\.github/workflows/pr-gate\.yml$|^scripts/lib/license-inventory\.mjs$'
                  AUDIT_PATTERN='^(package\.json|yarn\.lock|scripts/audit-dependencies\.mjs|scripts/dependency-audit-exceptions\.json|scripts/lib/dependency-audit[a-z-]*\.mjs|scripts/audit-runtime\.mjs|scripts/lib/runtime-audit\.mjs|\.node-version)$|^\.github/workflows/(pr-gate|dependency-audit|runtime-audit)\.yml$|^\.yarnrc\.yml$|^\.npmrc$|^\.yarn/|^\.gitattributes$|^\.github/actions/|^(apps|packages)/[^/]+/package\.json$|^\.github/workflows/'

                  sdd=false
                  root_docs=false
                  tooling=false
                  code=false
                  audit=false
                  while IFS= read -r -d '' FILE; do
                    if [[ "$FILE" =~ $SDD_PATTERN ]]; then sdd=true; fi
                    if [[ "$FILE" =~ $ROOT_DOCS_PATTERN ]]; then root_docs=true; fi
                    if [[ "$FILE" =~ $TOOLING_PATTERN ]]; then tooling=true; fi
                    if [[ "$FILE" =~ $CODE_PATTERN ]]; then code=true; fi
                    if [[ "$FILE" =~ $AUDIT_PATTERN ]]; then audit=true; fi
                  done < "$RUNNER_TEMP/pr-paths"
                  {
                    echo "sdd=$sdd"
                    echo "root-docs=$root_docs"
                    echo "tooling=$tooling"
                    echo "code=$code"
                    echo "audit=$audit"
                  } >> "$GITHUB_OUTPUT"

    sdd:
        # Governança num job só: verificação do SDD, formatação dos docs da raiz e testes dos
        # gates usam a mesma instalação de dependências. Cada verificação tem condição própria
        # por passo.
        name: 'governança: SDD, docs da raiz e gates'
        needs: detect-changes
        if: needs.detect-changes.outputs.sdd == 'true' || needs.detect-changes.outputs.root-docs == 'true' || needs.detect-changes.outputs.tooling == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - name: Instalar corepack (o Node 26 não o distribui)
              run: npm install --global corepack@0.36.0
            - name: Habilitar corepack
              run: corepack enable
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .node-version
                  cache: yarn
                  cache-dependency-path: yarn.lock
            - name: Instalar dependências
              run: yarn install --immutable
            - name: Testar checker e consolidação
              if: needs.detect-changes.outputs.sdd == 'true'
              run: yarn test:sdd
            - name: Verificar catálogo e links
              if: needs.detect-changes.outputs.sdd == 'true'
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  MERGE_SHA: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  git diff --no-renames --name-only -z "$BASE_SHA" "$MERGE_SHA" -- '*.md' > "$RUNNER_TEMP/pr-docs"
                  ARGS=()
                  while IFS= read -r -d '' FILE; do
                    if [[ "$FILE" != docs/development-strategies/sdd/templates/* ]] && [ -f "$FILE" ]; then
                      ARGS+=(--file "$FILE")
                    fi
                  done < "$RUNNER_TEMP/pr-docs"
                  yarn sdd:check "${ARGS[@]}"
            - name: Verificar formatação dos docs da raiz
              if: needs.detect-changes.outputs.root-docs == 'true'
              run: yarn docs:format:check
            - name: Testar hook, auditor e workflows
              if: needs.detect-changes.outputs.tooling == 'true'
              run: yarn test:gates

    code:
        name: 'code: check:all (typecheck, lint, test, build)'
        needs: detect-changes
        if: needs.detect-changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        env:
            COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false
            - name: Instalar corepack (o Node 26 não o distribui)
              run: npm install --global corepack@0.36.0
            - name: Habilitar corepack
              run: corepack enable
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .node-version
                  cache: yarn
                  cache-dependency-path: yarn.lock
            - name: Instalar dependências
              run: yarn install --immutable
            - name: Gates de código
              run: yarn check:all

    audit:
        name: 'segurança: dependências e runtime Node'
        needs: detect-changes
        if: needs.detect-changes.outputs.audit == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false
            - name: Instalar corepack (o Node 26 não o distribui)
              run: npm install --global corepack@0.36.0
            - name: Habilitar corepack
              run: corepack enable
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .node-version
                  cache: yarn
                  cache-dependency-path: yarn.lock
            - name: Instalar dependências
              run: yarn install --immutable
            - name: Auditoria de dependências
              run: yarn security:dependencies
            - name: Conferir runtime Node
              run: yarn security:runtime

    gate:
        # Único job a marcar como "Required" na proteção de branch. Sempre roda (if: always()),
        # mesmo se a governança ou a auditoria forem puladas ou falharem — é ele quem decide se o
        # PR pode mergear.
        name: 'gate (required): consolida governança e auditoria'
        needs: [detect-changes, sdd, code, audit]
        # Em rascunho nada roda, então o gate também é pulado (senão falharia por seleção
        # ausente); em PR pronta continua rodando sempre.
        if: always() && github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false
                  ref: ${{ github.event.pull_request.base.sha }}
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .node-version
            - name: Verificar resultado dos jobs condicionais
              env:
                  GATE_NEEDS: ${{ toJSON(needs) }}
              run: node scripts/sdd/check-job-results.mjs
