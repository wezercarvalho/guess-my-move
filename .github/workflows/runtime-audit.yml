name: runtime-audit

# Only active after merge into the default branch. No write permissions or automatic upgrade.
on:
    schedule:
        - cron: '37 8 * * *'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    audit:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .node-version
            - name: Conferir runtime Node (sem dependências)
              run: node scripts/audit-runtime.mjs
