name: runtime-audit

# Only active after merge into the default branch. No write permissions or automatic upgrade.
on:
    schedule:
        - cron: '37 8 * * *'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    audit:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
            - name: Conferir runtime Node (sem dependências)
              run: node scripts/audit-runtime.mjs
